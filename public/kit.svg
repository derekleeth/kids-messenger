<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bg)"/>
  <g transform="translate(112 150) scale(4)">
    <!-- ears -->
    <path d="M30 86 L52 14 Q56 8 62 14 L100 60 Z" fill="#f2b872" stroke="#5b3a1e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M170 86 L148 14 Q144 8 138 14 L100 60 Z" fill="#f2b872" stroke="#5b3a1e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M44 74 L56 32 L82 60 Z" fill="#ffb3c7"/>
    <path d="M156 74 L144 32 L118 60 Z" fill="#ffb3c7"/>
    <path d="M55 16 L46 -14 L64 10 Z" fill="url(#tuft)" stroke="#312e81" stroke-width="3" stroke-linejoin="round"/>
    <path d="M145 16 L154 -14 L136 10 Z" fill="url(#tuft)" stroke="#312e81" stroke-width="3" stroke-linejoin="round"/>
    <!-- cheek ruff -->
    <path d="M28 120 L8 140 L30 142 L14 162 L42 156 L40 176 L70 160 L130 160 L160 176 L158 156 L186 162 L170 142 L192 140 L172 120 Z" fill="#fde7c8" stroke="#5b3a1e" stroke-width="5" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="100" cy="112" rx="76" ry="64" fill="#f2b872" stroke="#5b3a1e" stroke-width="5"/>
    <path d="M92 52 q2 12 0 20 M100 50 q0 14 0 22 M108 52 q-2 12 0 20" stroke="#c97c3c" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="44" cy="100" r="4" fill="#c97c3c"/>
    <circle cx="156" cy="100" r="4" fill="#c97c3c"/>
    <circle cx="50" cy="88" r="3" fill="#c97c3c"/>
    <circle cx="150" cy="88" r="3" fill="#c97c3c"/>
    <!-- muzzle -->
    <ellipse cx="100" cy="140" rx="40" ry="28" fill="#fff4e4"/>
    <!-- eyes -->
    <ellipse cx="70" cy="110" rx="16" ry="19" fill="#22163d"/>
    <ellipse cx="130" cy="110" rx="16" ry="19" fill="#22163d"/>
    <circle cx="75" cy="102" r="6" fill="#fff"/>
    <circle cx="135" cy="102" r="6" fill="#fff"/>
    <circle cx="66" cy="117" r="3" fill="#fff"/>
    <circle cx="126" cy="117" r="3" fill="#fff"/>
    <!-- blush -->
    <ellipse cx="46" cy="132" rx="12" ry="7" fill="#ff8fab" opacity="0.6"/>
    <ellipse cx="154" cy="132" rx="12" ry="7" fill="#ff8fab" opacity="0.6"/>
    <!-- nose and mouth -->
    <path d="M90 128 Q100 122 110 128 Q104 138 100 139 Q96 138 90 128 Z" fill="#ff6f91" stroke="#5b3a1e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M100 139 q-6 12 -16 6 M100 139 q6 12 16 6" stroke="#5b3a1e" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- chat bubble -->
  <g transform="translate(640 640)">
    <path d="M20 0 h200 a40 40 0 0 1 40 40 v100 a40 40 0 0 1 -40 40 h-120 l-50 44 v-44 h-30 a40 40 0 0 1 -40 -40 v-100 a40 40 0 0 1 40 -40 z" fill="#fff" stroke="#312e81" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="70" cy="90" r="18" fill="#f472b6"/>
    <circle cx="120" cy="90" r="18" fill="#facc15"/>
    <circle cx="170" cy="90" r="18" fill="#22d3ee"/>
  </g>
</svg>
