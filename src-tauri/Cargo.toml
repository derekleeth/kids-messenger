[package]
name = "kitchat"
description = "KitChat: a family messenger with notes and lists"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "kitchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kit-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
log.workspace = true
tokio.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# The hub's REST API. No crypto provider of its own: ring is installed at startup (lib.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# The hub's `/live` WebSocket, over the same rustls.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# QR codes for joining a device, drawn as SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The device token sits in the OS keychain on desktop, and desktop notifications come from the plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# The Android Keystore seals the device token (src/secret/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
