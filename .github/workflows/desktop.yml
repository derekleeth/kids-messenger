# Builds the Windows installer for the desktop app (KitChat-<version>_x64-setup.exe) and attaches it to the run.
# Runs on a version tag (v0.3.0) or by hand from the Actions tab. Unsigned: Windows SmartScreen asks once
# ("More info" › "Run anyway"); see docs/desktop.md.
name: Desktop installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: cargo test -p kitchat
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: KitChat-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
